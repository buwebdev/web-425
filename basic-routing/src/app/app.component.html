<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="w4-shell">
  <header class="w4-header">
    <div class="w4-container w4-header-inner">
      <a class="w4-brand" routerLink="/" aria-label="Basic Routing Demo home">
        {{ title }}
      </a>
      <span class="w4-badge">WEB 425</span>
    </div>

    <nav class="w4-navbar" aria-label="Primary navigation">
      <div class="w4-container w4-nav">
        <a
          class="w4-nav-link"
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >Home</a>
        <a class="w4-nav-link" routerLink="/course" routerLinkActive="active">Route Data</a>
        <a class="w4-nav-link" routerLink="/about" routerLinkActive="active">About</a>
      </div>
    </nav>
  </header>

  <main id="main-content" class="w4-container w4-main">
    <router-outlet />
  </main>

  <footer class="w4-footer">
    <div class="w4-container w4-footer-inner">
      <div>
        <p class="w4-footer-brand">Basic Routing Demo</p>
        <p class="w4-footer-copy">A focused introduction to Angular routes.</p>
      </div>
      <p class="w4-footer-copyright">&copy; {{ currentYear }} WEB 425</p>
    </div>
  </footer>
</div>
